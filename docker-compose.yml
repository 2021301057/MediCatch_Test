# 공통 운영 설정: restart 정책 + 로그 rotation (10MB × 3개 = 컨테이너당 최대 30MB)
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── 인프라 ──────────────────────────────────────
  mysql:
    <<: *common
    image: mysql:8.0
    container_name: medicatch-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medicatch123}
      MYSQL_DATABASE: medicatch
    # 호스트의 mysql 클라이언트 디버깅용으로만 127.0.0.1에 바인딩 (외부 노출 차단)
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backend/treatmentRule.sql:/docker-entrypoint-initdb.d/treatmentRule.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MSA 서비스 ───────────────────────────────────
  eureka-server:
    <<: *common
    build:
      context: ./backend
      dockerfile: eureka-server/Dockerfile
    container_name: medicatch-eureka
    expose:
      - "8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  gateway-service:
    <<: *common
    build:
      context: ./backend
      dockerfile: gateway-service/Dockerfile
    container_name: medicatch-gateway
    expose:
      - "8000"
    environment:
      SERVER_PORT: 8000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (min 64 chars for HS512)}
    depends_on:
      eureka-server:
        condition: service_healthy

  user-service:
    <<: *common
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: medicatch-user
    expose:
      - "8001"
    environment:
      SERVER_PORT: 8001
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicatch_user
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medicatch123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (min 64 chars for HS512)}
      CODEF_API_CLIENT_ID: ${CODEF_API_CLIENT_ID}
      CODEF_API_CLIENT_SECRET: ${CODEF_API_CLIENT_SECRET}
      CODEF_DEMO_CLIENT_ID: ${CODEF_DEMO_CLIENT_ID}
      CODEF_DEMO_CLIENT_SECRET: ${CODEF_DEMO_CLIENT_SECRET}
      CODEF_PUBLIC_KEY: ${CODEF_PUBLIC_KEY}
      CODEF_USE_DEMO: ${CODEF_USE_DEMO:-true}
    depends_on:
      mysql:
        condition: service_healthy

  health-service:
    <<: *common
    build:
      context: ./backend
      dockerfile: health-service/Dockerfile
    container_name: medicatch-health
    expose:
      - "8002"
    environment:
      SERVER_PORT: 8002
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicatch_health
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medicatch123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CODEF_HEALTH_API_URL: ${CODEF_HEALTH_API_URL:-https://api.codef.io}
      CODEF_API_CLIENT_ID: ${CODEF_API_CLIENT_ID}
      CODEF_API_CLIENT_SECRET: ${CODEF_API_CLIENT_SECRET}
      CODEF_DEMO_CLIENT_ID: ${CODEF_DEMO_CLIENT_ID}
      CODEF_DEMO_CLIENT_SECRET: ${CODEF_DEMO_CLIENT_SECRET}
      CODEF_PUBLIC_KEY: ${CODEF_PUBLIC_KEY}
      CODEF_USE_DEMO: ${CODEF_USE_DEMO:-true}
    depends_on:
      mysql:
        condition: service_healthy

  insurance-service:
    <<: *common
    build:
      context: ./backend
      dockerfile: insurance-service/Dockerfile
    container_name: medicatch-insurance
    expose:
      - "8003"
    environment:
      SERVER_PORT: 8003
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicatch_insurance
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medicatch123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CODEF_API_CLIENT_ID: ${CODEF_API_CLIENT_ID}
      CODEF_API_CLIENT_SECRET: ${CODEF_API_CLIENT_SECRET}
      CODEF_DEMO_CLIENT_ID: ${CODEF_DEMO_CLIENT_ID}
      CODEF_DEMO_CLIENT_SECRET: ${CODEF_DEMO_CLIENT_SECRET}
      CODEF_PUBLIC_KEY: ${CODEF_PUBLIC_KEY}
      CODEF_USE_DEMO: ${CODEF_USE_DEMO:-true}
    depends_on:
      mysql:
        condition: service_healthy

  analysis-service:
    <<: *common
    build:
      context: ./backend
      dockerfile: analysis-service/Dockerfile
    container_name: medicatch-analysis
    expose:
      - "8004"
    environment:
      SERVER_PORT: 8004
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicatch_analysis
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medicatch123}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy

  chat-service:
    <<: *common
    build:
      context: ./backend
      dockerfile: chat-service/Dockerfile
    container_name: medicatch-chat
    expose:
      - "8007"
    environment:
      SERVER_PORT: 8007
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicatch_chat
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medicatch123}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy

  # ── 프론트엔드 ────────────────────────────────────
  # 외부에 노출되는 유일한 포트. nginx가 / → 정적 파일, /api/ → gateway-service:8000 프록시
  frontend:
    <<: *common
    build:
      context: ./frontend
    container_name: medicatch-frontend
    ports:
      - "80:3000"
    depends_on:
      - gateway-service

volumes:
  mysql_data:
