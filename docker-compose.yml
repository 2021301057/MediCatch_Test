services:
  # ── 인프라 ──────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: medicatch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medicatch123}
      MYSQL_DATABASE: medicatch
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: medicatch-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin123}
    ports:
      - "5672:5672"
      - "15672:15672"

  # ── MSA 서비스 ───────────────────────────────────
  eureka-server:
    build:
      context: ./backend
      dockerfile: eureka-server/Dockerfile
    container_name: medicatch-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  gateway-service:
    build:
      context: ./backend
      dockerfile: gateway-service/Dockerfile
    container_name: medicatch-gateway
    ports:
      - "8000:8000"
    environment:
      SERVER_PORT: 8000
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-medicatch-jwt-secret-key-2026}
    depends_on:
      eureka-server:
        condition: service_healthy

  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: medicatch-user
    ports:
      - "8001:8001"
    environment:
      SERVER_PORT: 8001
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicatch_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-medicatch123}}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-medicatch-jwt-secret-key-2026}
      CODEF_API_CLIENT_ID: ${CODEF_API_CLIENT_ID}
      CODEF_API_CLIENT_SECRET: ${CODEF_API_CLIENT_SECRET}
      CODEF_DEMO_CLIENT_ID: ${CODEF_DEMO_CLIENT_ID}
      CODEF_DEMO_CLIENT_SECRET: ${CODEF_DEMO_CLIENT_SECRET}
      CODEF_PUBLIC_KEY: ${CODEF_PUBLIC_KEY}
      CODEF_USE_DEMO: ${CODEF_USE_DEMO:-true}
    depends_on:
      mysql:
        condition: service_healthy

  health-service:
    build:
      context: ./backend
      dockerfile: health-service/Dockerfile
    container_name: medicatch-health
    ports:
      - "8003:8003"
    environment:
      SERVER_PORT: 8003
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicatch_health?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-medicatch123}}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      CODEF_HEALTH_API_URL: ${CODEF_HEALTH_API_URL:-https://api.codef.io}
      CODEF_API_CLIENT_ID: ${CODEF_API_CLIENT_ID}
      CODEF_API_CLIENT_SECRET: ${CODEF_API_CLIENT_SECRET}
      CODEF_DEMO_CLIENT_ID: ${CODEF_DEMO_CLIENT_ID}
      CODEF_DEMO_CLIENT_SECRET: ${CODEF_DEMO_CLIENT_SECRET}
      CODEF_PUBLIC_KEY: ${CODEF_PUBLIC_KEY}
      CODEF_USE_DEMO: ${CODEF_USE_DEMO:-true}
    depends_on:
      mysql:
        condition: service_healthy

  insurance-service:
    build:
      context: ./backend
      dockerfile: insurance-service/Dockerfile
    container_name: medicatch-insurance
    ports:
      - "8004:8004"
    environment:
      SERVER_PORT: 8004
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicatch_insurance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-medicatch123}}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      CODEF_API_CLIENT_ID: ${CODEF_API_CLIENT_ID}
      CODEF_API_CLIENT_SECRET: ${CODEF_API_CLIENT_SECRET}
      CODEF_DEMO_CLIENT_ID: ${CODEF_DEMO_CLIENT_ID}
      CODEF_DEMO_CLIENT_SECRET: ${CODEF_DEMO_CLIENT_SECRET}
      CODEF_PUBLIC_KEY: ${CODEF_PUBLIC_KEY}
      CODEF_USE_DEMO: ${CODEF_USE_DEMO:-true}
    depends_on:
      mysql:
        condition: service_healthy

  analysis-service:
    build:
      context: ./backend
      dockerfile: analysis-service/Dockerfile
    container_name: medicatch-analysis
    ports:
      - "8005:8005"
    environment:
      SERVER_PORT: 8005
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicatch_analysis?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-medicatch123}}
      RABBITMQ_HOST: rabbitmq
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  chat-service:
    build:
      context: ./backend
      dockerfile: chat-service/Dockerfile
    container_name: medicatch-chat
    ports:
      - "8002:8002"
    environment:
      SERVER_PORT: 8002
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medicatch_chat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD:-medicatch123}}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-4o}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      mysql:
        condition: service_healthy

  # ── 프론트엔드 ────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: medicatch-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:8000/api
      REACT_APP_OPENAI_KEY: ${OPENAI_API_KEY}
    depends_on:
      - gateway-service

volumes:
  mysql_data:
